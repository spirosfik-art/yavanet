# Κάθε βράδυ: φωτογραφίες για νέους οδηγούς + ~25 παλιά άρθρα παίρνουν πρακτική ενότητα + «שאלות נפוצות» (FAQ για Google), μέχρι να γίνουν όλα.
name: Enrich articles
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "πόσα άρθρα το πολύ"
        default: "25"
concurrency:
  group: yavanet-content
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Photos for new guides
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node automation/fill-images.mjs
      - name: Enrich articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node automation/enrich.mjs "${{ github.event.inputs.max || '25' }}"
      - name: Save, build, deploy
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA4_ID: ${{ vars.GA4_ID }}
          CLARITY_ID: ${{ vars.CLARITY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}
          INDEXNOW_ALL: "1"
        run: |
          git config user.name "yavanet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: enrich articles $(date -u +%FT%TZ)"
          git pull --rebase --autostash && git push
          node build.mjs && bash scripts/deploy.sh
