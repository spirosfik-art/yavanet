# «יוונט מסביר»: reel εξήγησης (3D + νέον + υπότιτλοι + φωνή Gemini). Προς το παρόν μόνο προεπισκόπηση (branch explainer).
name: Explainer reel
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "αρχείο στο automation/explainer/episodes (χωρίς .json)"
        default: "thessaloniki-metro"
      voice:
        description: "φωνή Gemini (π.χ. Charon, Puck, Orus, Fenrir, Kore)"
        default: "Charon"
permissions:
  contents: write
concurrency:
  group: yavanet-explainer
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null 2>&1 || true
      - name: Render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_VOICE: ${{ github.event.inputs.voice }}
        run: |
          node automation/explainer/render.mjs "automation/explainer/episodes/${{ github.event.inputs.episode }}.json" out 2>&1 | tee r.log
          grep -E "tts|σύνολο|έτοιμο|error|Error" r.log | tail -25 | while read -r l; do echo "::notice::$l"; done
      - name: Upload (branch explainer)
        run: |
          cd out && rm -f *.pcm video.mp4 && git init -q -b explainer && git config user.name yavanet-bot && git config user.email bot@yavanet.gr
          git add -A && git commit -qm "explainer [skip ci]" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" explainer
