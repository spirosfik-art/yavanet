# Ξανά σύνθεση (υπότιτλοι/γραφικά/ήχος) από τα καρέ μιας προηγούμενης εκτέλεσης 3D — χωρίς νέο rendering.
name: Explainer 3D reassemble
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
      episode:
        default: "online-voting"
permissions:
  contents: write
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: art
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Σύνθεση
        run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          mkdir -p out all && cp art/frames-*/*.jpg all/ && cp art/prep/voice.wav out/
          N=$(node -e "console.log(require('./art/prep/bounds.json').scenes.length)")
          for i in $(seq 0 $((N-1))); do s=$(printf "%02d" $i); ffmpeg -y -loglevel error -framerate 24 -pattern_type glob -i "all/s${s}_*.jpg" -vf "scale=1080:1920:flags=lanczos" -c:v libx264 -crf 17 -pix_fmt yuv420p out/clip$i.mp4; done
          BIG_TOP=300px BOUNDS_FILE=art/prep/bounds.json CLIP_SOURCE=veo node automation/explainer/veo-render.mjs automation/explainer/episodes/${{ github.event.inputs.episode }}.json out 2>&1 | tail -3 | while read -r l; do echo "::notice::$l"; done
          cd out && rm -f clip*.mp4 *.png seg*.mp4 base.mp4 gfx.mp4 && git init -q -b explainer3d && git config user.name yavanet-bot && git config user.email bot@yavanet.gr
          git add -A && git commit -qm "3d [skip ci]" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" explainer3d
