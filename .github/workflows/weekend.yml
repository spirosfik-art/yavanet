# «Το Σαββατοκύριακο στην Αθήνα»: κάθε Πέμπτη ~10:00 Αθήνα. Ανεβαίνει στο site με την επόμενη αυτόματη ροή (μέσα σε 1 ώρα).
# Δοκιμή: αλλάζετε το content/weekend-trigger.json ή «Run workflow».
name: Weekend in Athens
on:
  schedule:
    - cron: "0 7 * * 4"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/weekend-trigger.json"]
concurrency:
  group: yavanet-content
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  weekend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_SELECT_MODEL: ${{ vars.GEMINI_SELECT_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node automation/weekend.mjs
      - name: Save
        run: |
          git config user.name "yavanet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/articles
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "auto: weekend in Athens $(date -u +%F)"
          git pull --rebase && git push
