# Ανεβάζει το ρολόι yavanet-cron (Cloudflare Worker) που ξεκινά τις αυτοματοποιήσεις ακριβώς στην ώρα τους.
name: Cron worker
on:
  push:
    branches: [main]
    paths: ["cron-worker/**", ".github/workflows/cron-worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy worker + secrets
        working-directory: cron-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@3 deploy > dep.log 2>&1; rc=$?
          grep -v "^\s*$" dep.log | tail -12 | while read -r l; do echo "::notice::$l"; done
          [ $rc = 0 ] || exit $rc
          echo -n "${{ secrets.GH_DISPATCH_TOKEN }}" | npx -y wrangler@3 secret put GH_TOKEN 2>&1 | tail -2
          echo -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" | npx -y wrangler@3 secret put TELEGRAM_BOT_TOKEN 2>&1 | tail -2
          echo -n "${{ secrets.TELEGRAM_OWNER_CHAT_ID }}" | npx -y wrangler@3 secret put TELEGRAM_OWNER_CHAT_ID 2>&1 | tail -2
      - name: Test dispatch permission
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ig-stories.yml/dispatches \
            -d '{"ref":"main","inputs":{"kind":"alerts","publish":"no","sched":"0"}}')
          echo "::notice::dispatch test HTTP $code"; [ "$code" = "204" ]
