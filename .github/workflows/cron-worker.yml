# Ανεβάζει το ρολόι yavanet-cron στο Cloudflare (ξεκινά reels/stories ακριβώς στην ώρα τους).
name: Cron worker deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cron-worker/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN_V: ${{ secrets.GH_DISPATCH_TOKEN }}
      TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        working-directory: cron-worker
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          GH_TOKEN_V="$(printf '%s' "$GH_TOKEN_V" | tr -d '[:space:]')"
          npx -y wrangler@4 deploy 2>&1 | tail -15
          printf '%s' "$GH_TOKEN_V" | npx -y wrangler@4 secret put GH_TOKEN 2>&1 | tail -2
          printf '%s' "$TG_BOT" | npx -y wrangler@4 secret put TELEGRAM_BOT_TOKEN 2>&1 | tail -2
          printf '%s' "$TG_CHAT" | npx -y wrangler@4 secret put TELEGRAM_OWNER_CHAT_ID 2>&1 | tail -2
          echo "::notice::cron worker deployed"
