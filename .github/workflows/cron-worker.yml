# Ανεβάζει το ρολόι yavanet-cron στο Cloudflare (ξεκινά reels/stories ακριβώς στην ώρα τους).
name: Cron worker deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cron-worker/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN_V: ${{ secrets.GH_DISPATCH_TOKEN }}
      TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        working-directory: cron-worker
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{40,}' | head -1 || true)"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && export CLOUDFLARE_ACCOUNT_ID="$(curl -s https://api.cloudflare.com/client/v4/accounts -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -oE '"id":"[0-9a-f]{32}"' | head -1 | cut -d'"' -f4)"
          GH_TOKEN_V="$(printf '%s' "$GH_TOKEN_V" | tr -d '[:space:]')"
          npx -y wrangler@4 deploy > dep.log 2>&1 || echo "::warning::deploy failed"; tail -25 dep.log | sed 's/\x1b\[[0-9;]*m//g' | while read -r l; do echo "::notice::$l"; done
          printf '%s' "$GH_TOKEN_V" | npx -y wrangler@4 secret put GH_TOKEN 2>&1 | tail -2 | while read -r l; do echo "::notice::PUT $l"; done
          printf '%s' "$TG_BOT" | npx -y wrangler@4 secret put TELEGRAM_BOT_TOKEN 2>&1 | tail -2
          printf '%s' "$TG_CHAT" | npx -y wrangler@4 secret put TELEGRAM_OWNER_CHAT_ID 2>&1 | tail -2
          npx -y wrangler@4 secret list 2>&1 | grep -o '"name": *"[A-Z_]*"' | while read -r l; do echo "::notice::SECRET $l"; done
          npx -y wrangler@4 deployments list 2>&1 | tail -6 | while read -r l; do echo "::notice::DL $l"; done
          curl -s "https://yavanet-cron.$(npx -y wrangler@4 whoami 2>/dev/null | grep -o '[a-z0-9-]*\.workers\.dev' | head -1)" | head -c 200; true
