# Ανέβασμα του site όταν αλλάζει κάτι χειροκίνητα (design, ρυθμίσεις, άρθρα).
name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: ["automation/state.json"]
  workflow_dispatch:
concurrency:
  group: yavanet-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.actor != 'yavanet-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA4_ID: ${{ vars.GA4_ID }}
          CLARITY_ID: ${{ vars.CLARITY_ID }}
      - run: bash scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}
          SYNC_SECRETS: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          BREVO_LEADS_LIST: ${{ vars.BREVO_LEADS_LIST }}
          BREVO_NL_LIST_HE: ${{ vars.BREVO_NL_LIST_HE }}
          BREVO_NL_LIST_EN: ${{ vars.BREVO_NL_LIST_EN }}
          BREVO_DOI_TEMPLATE_HE: ${{ vars.BREVO_DOI_TEMPLATE_HE }}
          BREVO_DOI_TEMPLATE_EN: ${{ vars.BREVO_DOI_TEMPLATE_EN }}
