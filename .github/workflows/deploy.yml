# Ανέβασμα του site όταν αλλάζει κάτι χειροκίνητα (design, ρυθμίσεις, άρθρα).
name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: ["automation/state.json"]
  workflow_dispatch:
concurrency:
  group: yavanet-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.actor != 'yavanet-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA4_ID: ${{ vars.GA4_ID }}
          CLARITY_ID: ${{ vars.CLARITY_ID }}
      - run: if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Cloudflare δεν έχει ρυθμιστεί ακόμα'; exit 0; fi; npx --yes wrangler@3 pages project create ${{ vars.CF_PROJECT || 'yavanet' }} --production-branch=main >/dev/null 2>&1 || true; npx --yes wrangler@3 pages deploy dist --project-name=${{ vars.CF_PROJECT || 'yavanet' }} --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
