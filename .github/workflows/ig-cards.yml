name: IG cards
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render test card (same code as the pipeline)
        run: |
          mkdir -p ig-out
          (which google-chrome chromium convert magick ffmpeg; google-chrome --version; node automation/ig-test.mjs ferries-in-greece-complete-guide) > ig-out/log.txt 2>&1 || true
          cp content/ig/*.jpg ig-out/ 2>/dev/null || true
      - name: Push to ig-cards branch
        run: |
          cd ig-out
          git init -q -b ig-cards
          git config user.name "yavanet-bot"
          git config user.email "bot@yavanet.gr"
          git add -A
          git commit -qm "IG test card [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ig-cards
