# Meta Graph API: ημερήσιο reel (20:00 ώρα Ισραήλ) + αυτόματες απαντήσεις σε σχόλια κάθε 30'.
# Χρειάζεται το secret META_TOKEN· χωρίς αυτό απλώς δεν κάνει τίποτα.
name: Meta (reel + comments)
on:
  schedule:
    - cron: "7 17 * * *"          # reel
    - cron: "*/30 5-21 * * *"     # σχόλια
  workflow_dispatch:
    inputs:
      task:
        description: "reel | publish-last (ανεβάζει το τελευταίο έτοιμο reel) | publish-explainer («יוונט מסביר» από το branch explainer) | stock (προεπισκόπηση reel με πλάνα) | comments (+DM) | dms | check | diag | social-weekly | scenes (μόνο προεπισκόπηση, χωρίς ανάρτηση)"
        default: check
      only:
        description: "μόνο ig ή μόνο fb (κενό = και τα δύο)"
        default: ""
permissions:
  contents: write
concurrency:
  group: yavanet-meta
  cancel-in-progress: false
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TASK: ${{ github.event.inputs.task || (github.event.schedule == '7 17 * * *' && 'reel' || 'comments') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check / comments
        if: env.TASK == 'check' || env.TASK == 'comments' || env.TASK == 'diag' || env.TASK == 'dms' || env.TASK == 'social-weekly'
        run: |
          if [ -z "$META_TOKEN" ]; then echo "::warning::NO_META_TOKEN"; [ "$TASK" = "check" ] && exit 1; exit 0; fi
          node automation/meta.mjs $TASK 2>&1 | tee meta.log
          if [ "$TASK" = "comments" ]; then node automation/meta.mjs dms 2>&1 | tee -a meta.log || true; fi
          echo "::notice::$(tail -c 900 meta.log | tr '\n' ' ')" || true
          grep DIAG meta.log | while read -r l; do echo "::notice::$l"; done || true
      - name: Save DM state
        if: env.TASK == 'comments' || env.TASK == 'dms'
        run: |
          git config user.name yavanet-bot && git config user.email bot@yavanet.gr
          for f in content/ig/dm-seen.json content/ig/comment-seen.json; do [ -f $f ] && git add $f; done; true
          git diff --cached --quiet || (git commit -qm "auto: DM state [skip ci]" && (git push || (git pull --rebase -X theirs && git push))) || true
      - name: Reel already today?
        if: env.TASK == 'reel'
        run: |
          node -e "let t={};try{t=JSON.parse(require('fs').readFileSync('content/ig/reel-last.json','utf8'))}catch{};const d=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Athens'});if(t.date===d)console.log('SKIP=1')" >> $GITHUB_ENV
      - name: Publish last ready reel
        if: env.TASK == 'publish-last' || env.TASK == 'publish-explainer' || env.TASK == 'publish-explainer3d'
        run: |
          B=reels; [ "$TASK" = "publish-explainer" ] && B=explainer; [ "$TASK" = "publish-explainer3d" ] && B=explainer3d
          mkdir -p out && for f in reel.mp4 caption.txt; do curl -sfL -o out/$f "https://raw.githubusercontent.com/${{ github.repository }}/$B/$f"; done
          ls -la out && REEL_URL="https://raw.githubusercontent.com/${{ github.repository }}/$B/reel.mp4" REEL_ONLY="${{ github.event.inputs.only }}" node automation/meta.mjs reel-publish out/reel.mp4 2>&1 | tee pub.log
          echo "::notice::$(tail -c 700 pub.log | tr '\n' ' ')"
      - name: Stock reel (πραγματικά πλάνα Pexels)
        if: (env.TASK == 'reel' || env.TASK == 'stock') && env.PEXELS_API_KEY != '' && env.SKIP != '1'
        timeout-minutes: 15
        run: |
          set +e
          if [ "$TASK" = "reel" ] && [ -z "$META_TOKEN" ]; then echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          REEL_DEBUG=$([ "$TASK" = stock ] && echo 1 || echo 0) node automation/reel-stock.mjs out 2>&1 | tee stock.log
          grep -E 'tts [0-9]|ΑΠΟΜΑΓΝΗΤΟΦΩΝΗΣΗ|ύποπτα' stock.log | while read -r l; do echo "::notice::$l"; done
          echo "::notice::$(tail -c 600 stock.log | tr '\n' ' ')"
          if [ -f out/reel.mp4 ]; then echo "STOCK=1" >> $GITHUB_ENV; elif [ "$TASK" = "stock" ]; then echo "SKIP=1" >> $GITHUB_ENV; fi
          exit 0
      - name: Stock log (πάντα)
        if: always() && (env.TASK == 'reel' || env.TASK == 'stock')
        run: |
          [ -f stock.log ] && tail -n 40 stock.log | while read -r l; do echo "::notice::$l"; done || echo "::notice::no stock.log"
      - name: Reel scenes
        if: (env.TASK == 'reel' || env.TASK == 'scenes') && env.STOCK != '1' && env.SKIP != '1'
        run: |
          if [ "$TASK" = "reel" ] && [ -z "$META_TOKEN" ]; then echo "χωρίς META_TOKEN – παράλειψη"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          node automation/meta.mjs reel-scenes out
          [ -f out/count.txt ] || echo "SKIP=1" >> $GITHUB_ENV
      - name: Render video
        if: (env.TASK == 'reel' || env.TASK == 'scenes') && env.SKIP != '1' && env.STOCK != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cd out
          N=$(cat count.txt); D=3.6; X=0.5
          for i in $(seq 0 $((N-1))); do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=10000 --window-size=1080,1920 --screenshot=$PWD/s$i.png file://$PWD/s$i.html
            ffmpeg -y -loglevel error -loop 1 -i s$i.png -vf "scale=1296:2304,zoompan=z='min(zoom+0.0009,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=108:s=1080x1920:fps=30,format=yuv420p" -t $D -c:v libx264 -preset medium -crf 20 c$i.mp4
          done
          IN=""; F=""; prev="0"; off=0
          for i in $(seq 0 $((N-1))); do IN="$IN -i c$i.mp4"; done
          for i in $(seq 1 $((N-1))); do
            off=$(echo "$off + $D - $X" | bc); t=slideleft; [ $i -eq $((N-1)) ] && t=fade
            F="$F[$prev][$i]xfade=transition=$t:duration=$X:offset=$off[v$i];"; prev="v$i"
          done
          TOT=$(echo "$off + $D" | bc)
          ffmpeg -y -loglevel error $IN -f lavfi -t $TOT -i anullsrc=r=44100:cl=stereo -filter_complex "${F}[$prev]format=yuv420p[v]" -map "[v]" -map $N:a -c:v libx264 -crf 20 -preset medium -c:a aac -shortest -movflags +faststart reel.mp4
          ffmpeg -y -loglevel error -i reel.mp4 -vf "fps=1/3,scale=270:480,tile=${N}x1" -frames:v 1 preview.jpg
          ls -la reel.mp4 preview.jpg
      - name: Publish reel
        if: env.TASK == 'reel' && env.SKIP != '1'
        run: node automation/meta.mjs reel-publish out/reel.mp4
      - name: Save reel state
        if: always() && (env.TASK == 'reel' || env.TASK == 'publish-last' || env.TASK == 'publish-explainer' || env.TASK == 'publish-explainer3d')
        run: |
          git config user.name yavanet-bot && git config user.email bot@yavanet.gr
          [ -f content/ig/reel-last.json ] && git add content/ig/reel-last.json
          git diff --cached --quiet || (git commit -qm "auto: reel state [skip ci]" && (git push || (git pull --rebase -X theirs && git push))) || true
      - name: Keep copy (branch reels)
        if: (env.TASK == 'reel' || env.TASK == 'scenes' || env.TASK == 'stock') && env.SKIP != '1'
        run: |
          mkdir keep && cp out/reel.mp4 out/preview.jpg out/caption.txt keep/ && cd keep
          git init -q -b reels
          git config user.name "yavanet-bot"; git config user.email "bot@yavanet.gr"
          git add -A; git commit -qm "reel $(date -u +%F) [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" reels
