# Μία φορά: κατεβάζει τις 5 φωτογραφίες περιοχής (Wikimedia Commons, CC) για τη σελίδα Βούλας
# και τις αποθηκεύει τοπικά, ώστε να μη φορτώνονται από τη Wikimedia (μπλοκάρεται σε iPhone).
name: Fetch Voula area photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-voula-area.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -e
          UA="YavanetBot/1.0 (https://yavanet.gr; info@sfproperties.gr)"
          get() { curl -fsSL -A "$UA" -o "site/assets/voula-area-$2.jpg" "https://upload.wikimedia.org/wikipedia/commons/thumb/$1/1280px-${1##*/}"; }
          get "7/77/Voula_-_panoramio_%289%29.jpg" v1
          get "6/66/Voula_-_panoramio_%286%29.jpg" v2
          get "2/21/Vouliagmeni_lake.jpg" lake
          get "5/5f/Sunset_at_Astir_Beach%2C_Vouliagmeni%2C_Athens%2C_Greece.jpg" astir
          get "0/0e/Glyfada_Marina_-_panoramio_%286%29.jpg" marina
          ls -la site/assets/voula-area-*
      - name: Commit
        run: |
          git config user.name "yavanet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/assets/voula-area-*.jpg
          git diff --cached --quiet || git commit -m "Voula: local copies of area photos (Wikimedia Commons)"
          git push
