# Φύλακας: κάθε ώρα ελέγχει ότι το site ανανεώνεται, ότι οι εκτελέσεις τρέχουν και ότι το bot λειτουργεί.
# Αν κάτι σταματήσει, σου στέλνει μήνυμα στο Telegram και ξεκινά ξανά τη ροή.
name: Watchdog
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["automation/watchdog.mjs", ".github/workflows/watchdog.yml"]
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node automation/watchdog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
