# Φτηνές πτήσεις Τελ Αβίβ → Ελλάδα: ενημέρωση κάθε πρωί, και κάθε Πέμπτη άρθρο + ειδοποίηση.
# Χρειάζεται secret TRAVELPAYOUTS_TOKEN (και προαιρετικά variable TRAVELPAYOUTS_MARKER για προμήθεια).
name: Flights
on:
  schedule:
    - cron: "20 4 * * 0-3,5,6"
    - cron: "20 5 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily ή weekly"
        default: daily
concurrency:
  group: yavanet-content
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  flights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ vars.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ "${{ github.event.schedule }}" = "20 5 * * 4" ]; then MODE=weekly; else MODE="${{ github.event.inputs.mode || 'daily' }}"; fi
          node automation/flights.mjs $MODE
      - name: Save, build, deploy
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA4_ID: ${{ vars.GA4_ID }}
          CLARITY_ID: ${{ vars.CLARITY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}
        run: |
          git config user.name "yavanet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: flights $(date -u +%FT%TZ)"
          git pull --rebase && git push
          node build.mjs && bash scripts/deploy.sh
