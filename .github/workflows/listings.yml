# Αγγελίες S.F. Properties (sfproperties.gr) + ισοτιμία EUR→ILS της ΕΚΤ → content/listings.json → σελίδες /nadlan/.
# Καθημερινά. Αν αποτύχει η λήψη, μένει το προηγούμενο αρχείο (το script δεν γράφει τίποτα).
# Προαιρετικά: ANTHROPIC_API_KEY ή GEMINI_API_KEY για μετάφραση νέων περιγραφών σε εβραϊκά/αγγλικά.
name: Listings
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
concurrency:
  group: yavanet-content
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  listings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch listings and ECB rate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          node automation/listings.mjs || echo "listings - αποτυχία, κρατάμε το προηγούμενο αρχείο"
      - name: Save, build, deploy
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA4_ID: ${{ vars.GA4_ID }}
          CLARITY_ID: ${{ vars.CLARITY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}
        run: |
          git config user.name "yavanet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/listings.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "auto: listings $(date -u +%FT%TZ)"
          git pull --rebase && git push
          node build.mjs && bash scripts/deploy.sh
