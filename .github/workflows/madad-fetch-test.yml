name: Madad fetch test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for s in kentro-athinas-perifereia athina-voreia-proastia-perifereia athina-notia-proastia-perifereia peiraias-perifereia; do curl -sL -A "$UA" -H "Accept-Language: en" "https://www.indomio.gr/en/agora-akiniton/attiki/$s/" -o $s.html; echo "$s $(wc -c < $s.html)"; done
          git init -q -b madad-test; git config user.name bot; git config user.email bot@yavanet.gr; git add -A; git commit -qm t; git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" madad-test
